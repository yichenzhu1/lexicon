name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Lexicon targets macOS 26 and uses its SDK (Liquid Glass), so CI needs a
    # macOS 26 runner with an Xcode 26 toolchain.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select the supported Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run regression suite
        run: swift run -Xswiftc -warnings-as-errors MdxKitTester

      - name: Run tab residency regression suite
        run: |
          swift run -Xswiftc -warnings-as-errors Lexicon --tab-state-test
          swift run -Xswiftc -warnings-as-errors Lexicon --tab-webview-test

      - name: Build and validate app bundle
        run: |
          scripts/make_app.sh
          plutil -lint build/Lexicon.app/Contents/Info.plist
          test -s build/Lexicon.app/Contents/Resources/Lexicon.icns
          test -s build/Lexicon.app/Contents/Resources/LICENSE.txt
          test -s build/Lexicon.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          test "$(plutil -extract CFBundleShortVersionString raw build/Lexicon.app/Contents/Info.plist)" = "0.4.0"
          test "$(plutil -extract CFBundleVersion raw build/Lexicon.app/Contents/Info.plist)" = "4"
          codesign --verify --deep --strict --verbose=2 build/Lexicon.app
